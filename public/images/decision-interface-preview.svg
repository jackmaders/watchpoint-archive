<svg aria-label="Watchpoint Tactical Decision Interface Preview" height="100%" role="img" viewBox="0 0 1920 1080" width="100%" xmlns="http://www.w3.org/2000/svg" >
  <title>Watchpoint Tactical Decision Interface Preview</title>
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="overlayBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="activeOptionGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>
    
    <!-- Filters -->
    <filter height="120%" id="shadowLg" width="120%" x="-10%" y="-10%" >
      <feDropShadow dx="0" dy="8" flood-color="#000000" flood-opacity="0.6" stdDeviation="16" />
    </filter>
    <filter height="140%" id="glowPrimary" width="140%" x="-20%" y="-20%" >
      <feGaussianBlur result="blur" stdDeviation="4" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background / Game Stage Canvas -->
  <rect fill="url(#bgGradient)" height="1080" width="1920" />

  <!-- Simulated Gameplay Scene: King's Row Night Atmosphere -->
  <!-- Ambient city silhouettes & lighting -->
  <path d="M 0,720 L 220,680 L 380,710 L 540,640 L 700,690 L 950,620 L 1200,670 L 1450,590 L 1700,650 L 1920,620 L 1920,1080 L 0,1080 Z" fill="#090d16" opacity="0.8" />
  <!-- Street lights & atmospheric glow -->
  <circle cx="340" cy="580" fill="#f59e0b" opacity="0.12" r="140" />
  <circle cx="980" cy="520" fill="#3b82f6" opacity="0.08" r="200" />
  <circle cx="1400" cy="480" fill="#ec4899" opacity="0.08" r="180" />

  <!-- Street grid perspective lines -->
  <path d="M 960,540 L 0,1080 M 960,540 L 400,1080 M 960,540 L 800,1080 M 960,540 L 1200,1080 M 960,540 L 1600,1080 M 960,540 L 1920,1080" stroke="#1e293b" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Player HUD: First-person elements -->
  <!-- Reticle -->
  <circle cx="850" cy="540" fill="none" opacity="0.8" r="16" stroke="#22c55e" stroke-width="2" />
  <circle cx="850" cy="540" fill="#22c55e" opacity="0.9" r="3" />
  <line opacity="0.8" stroke="#22c55e" stroke-width="2" x1="820" x2="842" y1="540" y2="540" />
  <line opacity="0.8" stroke="#22c55e" stroke-width="2" x1="858" x2="880" y1="540" y2="540" />
  <line opacity="0.8" stroke="#22c55e" stroke-width="2" x1="850" x2="850" y1="510" y2="532" />
  <line opacity="0.8" stroke="#22c55e" stroke-width="2" x1="850" x2="850" y1="548" y2="570" />

  <!-- Health Bar HUD (Bottom Left) -->
  <g transform="translate(60, 940)">
    <rect fill="#09090b" fill-opacity="0.85" height="48" rx="8" stroke="#27272a" stroke-width="1.5" width="260" />
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" x="20" y="32" >200</text>
    <text fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" x="75" y="32" >/ 200</text>
    <rect fill="#22c55e" height="16" rx="4" width="110" x="130" y="16" />
  </g>

  <!-- Top Player Information Bar -->
  <rect fill="#09090b" fill-opacity="0.9" height="64" stroke="#27272a" stroke-width="1" width="1920" x="0" y="0" />
  <g transform="translate(40, 20)">
    <circle cx="12" cy="12" fill="#ef4444" r="6" />
    <circle cx="32" cy="12" fill="#eab308" r="6" />
    <circle cx="52" cy="12" fill="#22c55e" r="6" />
    <text fill="#f4f4f5" font-family="monospace" font-size="16" font-weight="700" x="80" y="17" >Grandmaster Ana — King&apos;s Row Defense</text>
  </g>

  <g transform="translate(1600, 18)">
    <rect fill="#18181b" height="28" rx="6" stroke="#3f3f46" stroke-width="1" width="130" />
    <text fill="#a1a1aa" font-family="monospace" font-size="12" font-weight="700" x="18" y="19" >SCENARIO 2 / 5</text>
    <rect fill="#1e3a8a" fill-opacity="0.6" height="28" rx="6" stroke="#3b82f6" stroke-width="1" width="110" x="145" />
    <text fill="#60a5fa" font-family="monospace" font-size="12" font-weight="800" x="165" y="19" >LIVE DRILL</text>
  </g>

  <!-- Interactive Tactical Decision Drawer (Right Floating Card) -->
  <g filter="url(#shadowLg)" transform="translate(1080, 110)" >
    <!-- Drawer Container -->
    <rect fill="url(#overlayBg)" height="840" rx="16" stroke="#3f3f46" stroke-width="1.5" width="780" />
    
    <!-- Drawer Header -->
    <g transform="translate(40, 40)">
      <!-- Badge -->
      <rect fill="#1e3a8a" fill-opacity="0.4" height="32" rx="6" stroke="#3b82f6" stroke-width="1" width="210" />
      <text fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1" x="14" y="21" >TACTICS • MID-FIGHT</text>
      
      <!-- Timer -->
      <g transform="translate(560, 0)">
        <rect fill="#09090b" height="32" rx="6" stroke="#27272a" stroke-width="1" width="140" />
        <circle cx="20" cy="16" fill="#ef4444" r="6" />
        <text fill="#f4f4f5" font-family="monospace" font-size="13" font-weight="700" x="36" y="21" >00:04.8s</text>
      </g>
    </g>

    <!-- Prompt Section -->
    <g transform="translate(40, 110)">
      <text fill="#3b82f6" font-family="monospace" font-size="13" font-weight="800" letter-spacing="2" x="0" y="20" >DECISION POINT</text>
      <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" x="0" y="60" >The enemy Winston dives your co-support with</text>
      <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" x="0" y="96" >Barrier Shield. What is your immediate tactical priority?</text>
    </g>

    <!-- Options List -->
    <!-- Option A -->
    <g transform="translate(40, 250)">
      <rect fill="#18181b" height="84" rx="10" stroke="#27272a" stroke-width="1.5" width="700" />
      <rect fill="#27272a" height="36" rx="6" width="36" x="20" y="24" />
      <text fill="#a1a1aa" font-family="monospace" font-size="16" font-weight="800" x="32" y="48" >A</text>
      <text fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" x="76" y="49" >Fall back through hotel corridor and break sightlines</text>
    </g>

    <!-- Option B (Selected / Correct Focus) -->
    <g transform="translate(40, 355)">
      <rect fill="url(#activeOptionGrad)" height="84" rx="10" stroke="#3b82f6" stroke-width="2" width="700" />
      <rect fill="#3b82f6" height="36" rx="6" width="36" x="20" y="24" />
      <text fill="#ffffff" font-family="monospace" font-size="16" font-weight="800" x="32" y="48" >B</text>
      <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" x="76" y="49" >Save Biotic Grenade to counter dive commitment</text>
      <!-- Checkmark Icon -->
      <circle cx="654" cy="42" fill="#3b82f6" r="16" />
      <path d="M 646,42 L 652,48 L 663,36" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
    </g>

    <!-- Option C -->
    <g transform="translate(40, 460)">
      <rect fill="#18181b" height="84" rx="10" stroke="#27272a" stroke-width="1.5" width="700" />
      <rect fill="#27272a" height="36" rx="6" width="36" x="20" y="24" />
      <text fill="#a1a1aa" font-family="monospace" font-size="16" font-weight="800" x="32" y="48" >C</text>
      <text fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" x="76" y="49" >Use Sleep Dart on frontlining enemy tank</text>
    </g>

    <!-- Coaching Insight Panel -->
    <g transform="translate(40, 575)">
      <rect fill="#0f172a" height="135" rx="10" stroke="#1e3a8a" stroke-width="1" width="700" />
      <g transform="translate(24, 24)">
        <text fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1" x="0" y="16" >GRANDMASTER COACH EXPLANATION</text>
        <text fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" x="0" y="44" >Winston's bubble blocks targeted heals from distance. Holding grenade</text>
        <text fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" x="0" y="68" >allows you to splash both your co-support and Winston as he lands.</text>
      </g>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(40, 740)">
      <rect fill="#2563eb" height="54" rx="8" width="700" />
      <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="350" y="33" >Submit Tactical Decision</text>
    </g>
  </g>

  <!-- Video Timeline / Replay Control Bar (Bottom Full Width) -->
  <g transform="translate(60, 1000)">
    <rect fill="#09090b" fill-opacity="0.9" height="54" rx="10" stroke="#27272a" stroke-width="1.5" width="960" />
    <!-- Play/Pause -->
    <circle cx="34" cy="27" fill="#3b82f6" r="16" />
    <rect fill="#ffffff" height="14" rx="1" width="4" x="28" y="20" />
    <rect fill="#ffffff" height="14" rx="1" width="4" x="36" y="20" />
    <!-- Replay 10s -->
    <rect fill="#18181b" height="30" rx="6" stroke="#27272a" stroke-width="1" width="120" x="68" y="12" />
    <text fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" x="84" y="32" >↺ Replay 10s</text>
    <!-- Progress Bar -->
    <g transform="translate(210, 24)">
      <rect fill="#27272a" height="6" rx="3" width="600" />
      <rect fill="#3b82f6" height="6" rx="3" width="180" />
      <circle cx="180" cy="3" fill="#60a5fa" r="7" stroke="#ffffff" stroke-width="2" />
    </g>
    <!-- Timestamps -->
    <text fill="#a1a1aa" font-family="monospace" font-size="13" font-weight="600" x="830" y="32" >02:15 / 16:00</text>
  </g>
</svg>
