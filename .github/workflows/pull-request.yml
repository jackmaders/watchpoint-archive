name: PR Quality Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storybook-a11y:
    name: ♿ Run Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🌐 Setup Playwright Environment
        uses: ./.github/actions/setup-playwright
        with:
          browsers: "chromium"

      - name: 🏗️ Build Storybook App
        run: bun run storybook:build

      - name: ♿ Run Accessibility Checks
        run: bun run storybook:check:browser

      - name: 📩 Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-a11y-artifacts
          path: |
            storybook-static/
            test-results/
            playwright-report/
          retention-days: 14

  e2e-tests:
    name: 🎭 Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🌐 Setup Playwright Environment
        uses: ./.github/actions/setup-playwright
        with:
          browsers: "chromium firefox"

      - name: 🗄️ Apply Local Migrations
        run: bun run wrangler:migrate

      - name: 🌱 Seed Local Database
        run: bun run db:seed

      - name: 🧪 Run Browser Tests
        run: bun run playwright:e2e

      - name: 📩 Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: ✨ Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🏗️ Build Web Application
        run: bun run build

      - name: 🚨 Verify Drizzle Sync
        run: bun run check:drizzle-schema

      - name: 🚨 Verify Cloudflare Types
        run: bun run check:cloudflare-types

      - name: 🧭 Verify Route Inventory
        run: bun run check:routes

      - name: 🦺 Check Type Safety
        run: bun run typescript:check

      - name: 📐 Check FSD Architecture
        run: bun run steiger:check

      - name: ✨ Check Code Formatting
        run: bun run biome:check

  perf-budgets:
    name: ⚡ Check Performance Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🌐 Setup Playwright Environment
        uses: ./.github/actions/setup-playwright
        with:
          browsers: "chromium"

      - name: 🗄️ Apply Local Migrations
        run: bun run wrangler:migrate

      - name: 🌱 Seed Local Database
        run: bun run db:seed

      - name: 🏗️ Build Web Application
        run: bun run build

      - name: 🚀 Validate Worker Deploy
        run: bun run wrangler:deploy --dry-run

      - name: 🛈 Check Bundle Size
        run: bun run bundlewatch:check

      - name: 🚀 Start Preview Server
        run: bun run preview

      - name: ⏱️ Run Performance Audit
        env:
          BASE_URL: "http://127.0.0.1:3000"
        run: bun run check:perf-budgets

  unit-tests:
    name: 🧪 Run Unit Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🧪 Run Unit Test Coverage
        run: bun run vitest:coverage --reporter minimal --coverage.reporter text-summary
